name: Casting de voces (inglés)

# Muestras de voces para el canal en inglés (proceso/casting_en.py). Separado del casting en español.
# Solo clave gratuita salvo que se marque «pago». Si se acaba el cupo (10 voces al día), lo grabado se guarda
# en la caché y la siguiente tirada graba solo lo que falta. MP3 en el artefacto «casting-en».
on:
  workflow_dispatch:
    inputs:
      acento:
        description: "Acento (vacío = el de config: americano neutro)"
        default: ""
      pago:
        description: "Usar la clave de pago si se acaba el cupo gratuito"
        type: boolean
        default: false
  push:
    branches: [mejoras-ingles]
    paths: ["ci/casting-en.txt"]

concurrency:
  group: casting-en
  cancel-in-progress: false

jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar muestras ya grabadas
        uses: actions/cache/restore@v4
        with:
          path: casting_en
          key: casting-en-${{ github.run_id }}
          restore-keys: casting-en-
      - name: Instalar ffmpeg
        timeout-minutes: 10
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Generar muestras
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_IMAGENES: ${{ secrets.GEMINI_API_KEY_IMAGENES }}
          ACENTO: ${{ inputs.acento }}
          PAGO: ${{ inputs.pago && 'si' || 'no' }}
        run: python3 proceso/casting_en.py
      - name: Guardar muestras en la caché
        if: always()
        uses: actions/cache/save@v4
        with:
          path: casting_en
          key: casting-en-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: casting-en
          path: |
            casting_en/*.mp3
            casting_en/orden.txt
