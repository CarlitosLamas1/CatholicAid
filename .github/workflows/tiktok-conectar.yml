name: Conectar TikTok

# 1) Sin código: muestra en el resumen el enlace para autorizar la cuenta de CatolicAid.
# 2) Con código: lo canjea con las claves de GitHub y guarda el permiso cifrado en secretos/tiktok.enc.
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código que muestra la página de CatolicAid tras autorizar (vacío = dame el enlace)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      CODIGO: ${{ inputs.codigo }}
    steps:
      - uses: actions/checkout@v4
      - name: Enlace o canje
        run: |
          if [ -z "$CODIGO" ]; then
            URL=$(python3 proceso/tiktok.py url)
            echo "Abre este enlace y autoriza con la cuenta de CatolicAid: $URL"
            echo "### Autorizar TikTok" >> "$GITHUB_STEP_SUMMARY"
            echo "[Abrir TikTok y autorizar]($URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 proceso/tiktok.py canjear "$CODIGO"
            python3 proceso/tiktok.py comprobar
            git config user.name "gestor-catholicaid"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add secretos/tiktok.enc
            git commit -q -m "TikTok conectado (permiso cifrado)"
            git pull -q --rebase && git push -q
          fi
