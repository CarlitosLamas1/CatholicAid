name: "Poner miniaturas"

# Rehace y sube la miniatura de los vídeos de YouTube que no la tienen (los tres canales, la misma imagen en los tres).
on:
  workflow_dispatch:
    inputs:
      simular:
        description: "Solo decir qué haría, sin subir nada"
        type: boolean
        default: false
      todas:
        description: "Rehacer también las que ya tienen miniatura"
        type: boolean
        default: false
      vertical:
        description: "Subir la miniatura vertical (9:16) en vez de la horizontal"
        type: boolean
        default: false
      tras_proceso:
        description: "Las de los últimos 14 días con el vídeo ya procesado (portada de los Shorts)"
        type: boolean
        default: false
      solo:
        description: "Solo estos registros, separados por comas (p. ej. 2026-11-18-en)"
        default: ""

permissions:
  contents: write

concurrency:
  group: miniaturas
  cancel-in-progress: false

jobs:
  miniaturas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Letra y Pillow
        run: |
          pip install -q --timeout 60 pillow
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf ]; then
            timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq fonts-dejavu-core > /dev/null
          fi
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf
      - name: Miniaturas
        run: python3 proceso/miniaturas.py ${{ inputs.simular && '--simular' || '' }} ${{ inputs.todas && '--todas' || '' }} --solo="${{ inputs.solo }}" ${{ inputs.vertical && '--vertical' || '' }} ${{ inputs.tras_proceso && '--tras-proceso' || '' }}
      - name: Guardar
        if: always()
        run: python3 proceso/guardar.py "Miniaturas puestas" episodios/
