name: "Rosario v2: grabar cada voz de una vez"

# Cada voz graba todas sus piezas en una sola tirada (rosario/v2/lotes.json), se corta y se comprueba con whisper.
on:
  push:
    branches: [muestra-rosario]
    paths: ["rosario/v2/lotes.json"]

permissions:
  contents: read

jobs:
  lotes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - run: pip install -q --timeout 120 numpy faster-whisper imageio-ffmpeg
      - name: Grabar, cortar y escuchar
        env:
          GEMINI_API_KEY_IMAGENES: ${{ secrets.GEMINI_API_KEY_IMAGENES }}
        run: python3 rosario/v2/grabar_lotes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lotes-v2
          path: |
            rosario/salida/*.wav
            rosario/salida/informe.txt
          retention-days: 30
