name: Probar música

# Sube en privado una prueba de cada pieza nueva (musica_candidatas) para ver si YouTube la reclama antes de usarla.
# La lanza el Reloj cuando hay piezas sin probar; el resultado lo mira cada hora proceso/youtube_tareas.py.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probar-musica
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versión del sistema
        id: sistema
        run: echo "version=${ImageOS:-ubuntu}-${ImageVersion:-0}" >> "$GITHUB_OUTPUT"

      - name: Recuperar paquetes de la caché
        id: cache-apt
        uses: actions/cache/restore@v4
        with:
          path: ~/paquetes
          key: apt-ffmpeg-${{ steps.sistema.outputs.version }}-v1

      - name: Instalar herramientas
        id: instalar
        timeout-minutes: 20
        run: |
          if [ -n "$(ls ~/paquetes/*.deb 2>/dev/null)" ] && sudo dpkg -i ~/paquetes/*.deb > /dev/null 2>&1 \
             && ffmpeg -hide_banner -filters 2>/dev/null | grep -q " ass "; then
            echo "Instalado desde la caché"
          else
            for i in 1 2 3; do
              if timeout 300 sudo apt-get update -qq && \
                 timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true ffmpeg fonts-dejavu-core fonts-dejavu-extra > /dev/null; then
                break
              fi
              echo "Instalación lenta o fallida (intento $i); reintento"
              [ $i = 3 ] && exit 1
              sleep 20
            done
            mkdir -p ~/paquetes && cp /var/cache/apt/archives/*.deb ~/paquetes/ 2>/dev/null || true
            echo "nuevos=$(ls ~/paquetes/*.deb 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
          fi
          pip install -q --timeout 60 edge-tts pillow

      - name: Guardar paquetes en la caché
        if: steps.cache-apt.outputs.cache-hit != 'true' && steps.instalar.outputs.nuevos > 0
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/paquetes
          key: apt-ffmpeg-${{ steps.sistema.outputs.version }}-v1

      - name: Subir pruebas
        run: python proceso/probar_musica.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "gestor-catholicaid"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado/musica.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Música: pruebas subidas"
            git pull -q --rebase && git push -q
          fi
