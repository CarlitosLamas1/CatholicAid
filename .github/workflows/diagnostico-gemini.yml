name: Diagnóstico Gemini

# Prueba con una petición mínima qué modelos de texto de Gemini responden ahora con la clave gratuita
# y cuál es su límite gratuito (no gasta la clave de pago).
on: workflow_dispatch

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probar modelos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error
          G = "https://generativelanguage.googleapis.com/v1beta/models"
          H = {"Content-Type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"].strip()}
          with urllib.request.urlopen(urllib.request.Request(G + "?pageSize=200", headers=H), timeout=60) as r:
              modelos = [m["name"].split("/")[-1] for m in json.loads(r.read())["models"]
                         if "generateContent" in m.get("supportedGenerationMethods", [])]
          texto = [m for m in modelos if re.search(r"flash|pro|gemma", m) and not re.search(r"tts|image|live|audio|embed", m)]
          print("Modelos de texto:", ", ".join(texto))
          cuerpo = json.dumps({"contents": [{"parts": [{"text": "Responde solo: OK"}]}]}).encode()
          for m in texto:
              try:
                  with urllib.request.urlopen(urllib.request.Request(f"{G}/{m}:generateContent", cuerpo, H), timeout=60) as r:
                      print(f"✅ {m}: responde")
              except urllib.error.HTTPError as e:
                  t = e.read().decode(errors="replace")
                  lim = re.findall(r"metric: [^,]*?(\w+), limit: (\d+)", t)
                  print(f"❌ {m}: {e.code} {lim[:2] if lim else t[:120]}")
              except Exception as e:
                  print(f"❌ {m}: {e}")
          # Voces: cada modelo TTS tiene su propio cupo gratuito. Una petición mínima por modelo (gasta 1 si responde).
          tts = [m for m in modelos if "tts" in m]
          print("Modelos de voz:", ", ".join(tts))
          voz = json.dumps({"contents": [{"parts": [{"text": "Amen."}]}], "generationConfig": {
              "responseModalities": ["AUDIO"], "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": "Charon"}}}}}).encode()
          for m in tts:
              try:
                  with urllib.request.urlopen(urllib.request.Request(f"{G}/{m}:generateContent", voz, H), timeout=120) as r:
                      print(f"✅ {m}: responde (voz gratuita disponible)")
              except urllib.error.HTTPError as e:
                  t = e.read().decode(errors="replace")
                  lim = re.findall(r"metric: [^,]*?(\w+), limit: (\d+)", t)
                  print(f"❌ {m}: {e.code} {lim[:2] if lim else t[:160]}")
              except Exception as e:
                  print(f"❌ {m}: {e}")
