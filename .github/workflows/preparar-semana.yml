name: Preparar semana

# Cada sábado deja en el repo las citas de los próximos días y el texto de Torres Amat,
# para que el gestor semanal (domingo) pueda revisar los textos sin acceso a internet.
on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar citas y textos
        run: python proceso/preparar_semana.py
      - name: Guardar
        run: |
          python3 proceso/guardar.py "Citas y textos de la semana" biblia/
