name: "Mantenimiento"

# Una vez al día, de madrugada (lo lanza el Reloj; el cron es solo respaldo): borra releases viejas, archiva las
# imágenes antiguas y busca vídeos duplicados en YouTube. Resultado en estado/mantenimiento.json (parte diario).
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      estadisticas:
        description: "Calcular también los números de la semana (normalmente solo los domingos)"
        type: boolean
        default: false
      copia:
        description: "Enviar también la copia de seguridad (normalmente solo los domingos)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mantenimiento
  cancel-in-progress: false

jobs:
  mantenimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Mantenimiento
        run: python3 proceso/mantenimiento.py ${{ inputs.estadisticas && '--estadisticas' || '' }} ${{ inputs.copia && '--copia' || '' }}
      - name: Guardar
        if: always()
        run: python3 proceso/guardar.py "Mantenimiento diario" estado/ biblioteca/dias/ config/ fotogramas/
