name: "Telegram: órdenes"

# El bot se queda escuchando a Carlos (botones, comandos, texto, notas de voz y fotos) y responde en segundos.
# Cada relevo dura ~5,5 h y al terminar lanza el siguiente (los horarios de GitHub pueden retrasarse horas;
# el cron solo sirve de red por si la cadena se rompe). Solo hay uno a la vez (concurrency).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegram-ordenes
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Hora de inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"
      - name: Escuchar a Carlos
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_IMAGENES: ${{ secrets.GEMINI_API_KEY_IMAGENES }}
        run: python3 proceso/telegram_ordenes.py --escuchar 330
      - name: Lanzar el relevo
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Solo si ha durado más de 10 min: si algo falla al arrancar, no se relanza en bucle (lo recoge el cron).
          if [ $(( $(date +%s) - INICIO )) -gt 600 ]; then gh workflow run telegram-ordenes.yml; else echo "Duró poco: sin relevo"; fi
