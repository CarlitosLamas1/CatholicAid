name: Probar alineador de subtítulos

# Prueba el alineador sobre la copia de un vídeo ya hecho (run de «Evangelio diario»): no graba voces ni sube nada.
on:
  workflow_dispatch:
    inputs:
      run:
        description: "ID del run que hizo el vídeo (campo «run» del registro)"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --timeout 120 faster-whisper pillow
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Probar
        run: |
          gh run download "${{ inputs.run }}" -D copia
          D=$(dirname "$(find copia -name guion.json | head -1)")
          python3 proceso/probar_alineador.py "$D"
