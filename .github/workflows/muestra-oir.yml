name: "Muestra del Rosario (escuchar)"

# Transcribe con faster-whisper (gratis, sin Gemini) las voces de rosario/oir/ para comprobar que no falta texto.
on:
  push:
    branches: [muestra-rosario]
    paths: ["rosario/oir/**", ".github/workflows/muestra-oir.yml"]

permissions:
  contents: read

jobs:
  oir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Escuchar
        run: |
          pip install -q --timeout 120 faster-whisper
          python3 - <<'PY'
          import glob, wave
          import numpy as np
          from faster_whisper import WhisperModel
          m = WhisperModel("small", device="cpu", compute_type="int8")
          for f in sorted(glob.glob("rosario/oir/*.wav")):
              print("=====", f)
              with wave.open(f) as w:
                  audio = np.frombuffer(w.readframes(w.getnframes()), dtype=np.int16).astype(np.float32) / 32768
              segs, _ = m.transcribe(audio, language="es")
              for s in segs:
                  print(f"[{s.start:6.2f}-{s.end:6.2f}] {s.text.strip()}")
          PY
