name: Verificar secretos
on: workflow_dispatch
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar Gemini y YouTube
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.parse, urllib.error

          def call(url, data=None, headers=None):
              req = urllib.request.Request(url, data=data, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:500]

          ok = True
          for k in ["GEMINI_API_KEY", "YT_CLIENT_ID", "YT_CLIENT_SECRET", "YT_REFRESH_TOKEN"]:
              v = os.environ.get(k, "")
              print(f"{k}: {'presente' if v else 'VACIO'} ({len(v)} caracteres, espacios sobrantes: {v != v.strip()})")
              ok &= bool(v)

          key = os.environ["GEMINI_API_KEY"].strip()
          g = "https://generativelanguage.googleapis.com/v1beta/models/"
          h = {"Content-Type": "application/json", "x-goog-api-key": key}
          body = json.dumps({"contents": [{"parts": [{"text": "Responde solo: OK"}]}]}).encode()
          s, r = call(g + "gemini-3.8-flash:generateContent", body, h)
          print("Gemini texto:", s, r["candidates"][0]["content"]["parts"][0]["text"].strip() if s == 200 else r)
          ok &= s == 200

          tts = json.dumps({"contents": [{"parts": [{"text": "Paz a vosotros."}]}],
                            "generationConfig": {"responseModalities": ["AUDIO"],
                            "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": "Charon"}}}}}).encode()
          s, r = call(g + "gemini-2.5-flash-preview-tts:generateContent", tts, h)
          print("Gemini voz:", s, "audio recibido" if s == 200 else r)
          ok &= s == 200

          s, lista = call(g.rstrip("/") + "?pageSize=200", headers=h)
          imagen = [m["name"].split("/")[-1] for m in (lista.get("models", []) if s == 200 else [])
                    if "image" in m["name"] or "imagen" in m["name"]]
          print("Modelos de imagen disponibles:", imagen)
          for m in imagen[:4]:
              if m.startswith("imagen"):
                  s2, r2 = call(g + m + ":predict", json.dumps({"instances": [{"prompt": "A watercolor of a lamb in a meadow"}],
                                                               "parameters": {"sampleCount": 1, "aspectRatio": "9:16"}}).encode(), h)
              else:
                  s2, r2 = call(g + m + ":generateContent", json.dumps({"contents": [{"parts": [{"text": "A watercolor of a lamb in a meadow, vertical"}]}],
                                                                        "generationConfig": {"responseModalities": ["IMAGE", "TEXT"]}}).encode(), h)
              print("Imagen", m, "->", s2, "OK, imagen generada" if s2 == 200 else str(r2)[:300])

          data = urllib.parse.urlencode({
              "client_id": os.environ["YT_CLIENT_ID"].strip(),
              "client_secret": os.environ["YT_CLIENT_SECRET"].strip(),
              "refresh_token": os.environ["YT_REFRESH_TOKEN"].strip(),
              "grant_type": "refresh_token"}).encode()
          s, r = call("https://oauth2.googleapis.com/token", data)
          print("YouTube token:", s, ("OK, permisos: " + r.get("scope", "")) if s == 200 else r)
          ok &= s == 200
          if s == 200:
              if "youtube.readonly" not in r.get("scope", "") and "auth/youtube " not in r.get("scope", "") + " ":
                  print("FALTA el permiso youtube.readonly: no puedo confirmar el canal ni leer estadisticas")
                  ok = False
              s2, c = call("https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true",
                           headers={"Authorization": "Bearer " + r["access_token"]})
              if s2 == 200 and c.get("items"):
                  print("Canal:", c["items"][0]["snippet"]["title"], "|", c["items"][0]["id"])
              else:
                  print("Canal: NO ENCONTRADO", s2, str(c)[:200])
                  ok = False

          print("RESULTADO:", "TODO OK" if ok else "HAY PROBLEMAS")
          if not ok:
              raise SystemExit(1)
