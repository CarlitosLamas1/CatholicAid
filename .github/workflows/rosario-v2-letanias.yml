name: "Rosario v2: letanías a dos voces"
on:
  push:
    branches: [muestra-rosario]
    paths: ["rosario/v2/letanias.json"]
permissions:
  contents: read
jobs:
  letanias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - run: pip install -q --timeout 120 numpy faster-whisper
      - name: Grabar y comprobar
        env:
          GEMINI_API_KEY_IMAGENES: ${{ secrets.GEMINI_API_KEY_IMAGENES }}
        run: python3 rosario/v2/letanias.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: letanias-v2
          path: |
            rosario/salida/letanias*.wav
            rosario/salida/letanias_tiempos.json
          retention-days: 30
