name: "Comprobaciones"

# Pruebas rápidas (sin red ni cupo) cada vez que cambia el proceso, la configuración o un workflow.
on:
  push:
    branches: [main]
    paths: ["proceso/**", "pruebas_codigo/**", "config/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: El código se entiende
        run: python3 -m py_compile proceso/*.py pruebas_codigo/*.py
      - name: Los workflows y la configuración se pueden leer
        run: |
          python3 - <<'PY'
          import glob, json, yaml
          for f in glob.glob(".github/workflows/*.yml"):
              yaml.safe_load(open(f, encoding="utf-8"))
          for f in glob.glob("config/*.json"):
              json.load(open(f, encoding="utf-8"))
          print("ok")
          PY
      - name: Pruebas
        run: python3 -m unittest discover -s pruebas_codigo -p "prueba_*.py" -v
