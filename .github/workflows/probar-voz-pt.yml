name: Probar voz portugués

# Prueba si los modelos de voz con cupo propio (3.8) sirven para el portugués SIN leer las instrucciones en voz alta.
# Solo gasta cupo de los modelos 3.8 (nunca el del español ni el del inglés). Lanzar: cambiar ci/voz-pt.txt.
on:
  push:
    branches: ["claude/**"]
    paths: ["ci/voz-pt.txt"]

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q faster-whisper
      - name: Probar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python proceso/probar_voz_pt.py
