name: Reloj

# ENVOLTORIO FINO (17/11/2026). La marca horaria de la rutina «Revisor diario» es un push a esta rama y GitHub usa el
# reloj.yml de ESTA rama, no el de main. Aquí no hay lógica: solo llama a proceso/reloj_tirada.sh de main (4 pasadas
# cada 10 minutos). No copies aquí la lógica: se desincroniza (esta rama llevaba una copia antigua de una sola pasada).
# Los cron y el arranque a mano están en el reloj.yml de main.
on:
  push:
    branches: [reloj]

permissions:
  contents: read
  actions: write

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mirar (4 pasadas cada 10 minutos)
        run: bash proceso/reloj_tirada.sh "${{ github.event_name }}"
