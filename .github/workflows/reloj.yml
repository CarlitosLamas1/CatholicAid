name: Reloj

# El director de orquesta: lanza lo que falte (vídeos de mañana y pasado mañana, publicación revisada, TikTok,
# Instagram, comentarios, parte diario) sin duplicar nunca.
# Desde el 14/11/2026 es CONTINUO: cada tirada dura casi 6 h, mira cada 10 minutos y, al acabar, se relanza sola.
# Así ya no dependemos de los cron de GitHub (llegan horas tarde o no llegan). El repositorio es público: no gasta
# minutos de pago. Si la cadena se rompe, la vuelven a arrancar el cron de cada hora o la marca que sube la rutina
# «Revisor diario» a la rama «reloj». Solo hay una tirada a la vez (concurrency).
on:
  push:
    branches: [reloj]
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mirar cada 10 minutos (casi 6 h)
        run: |
          FIN=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$FIN" ]; do
            git fetch -q origin main && git reset -q --hard origin/main || true
            echo "::group::Pasada $(TZ=Europe/Madrid date '+%d/%m %H:%M')"
            timeout 300 python3 proceso/reloj.py || echo "La pasada falló; sigo con la siguiente."
            echo "::endgroup::"
            sleep 600
          done
      - name: Relanzarse (la siguiente tirada continúa la vigilancia)
        if: always()
        run: gh workflow run reloj.yml --ref main || echo "No pude relanzarme; me arranca el cron de cada hora."
