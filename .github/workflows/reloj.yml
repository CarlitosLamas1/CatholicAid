name: Reloj

# El director de orquesta: lanza lo que falte (vídeos de mañana y pasado mañana, publicación revisada, TikTok,
# Instagram, comentarios, parte diario) sin duplicar nunca.
# Desde el 15/11/2026 es LIGERO (antes corría casi 6 h seguidas y se relanzaba solo: demasiado uso de GitHub para
# lo que hace). Lo despierta cada hora la marca que sube la rutina «Revisor diario» a la rama «reloj» (puntual): esa
# tirada mira 4 veces, cada 10 minutos (media hora). Los cron son solo respaldo por si la rutina falla y hacen una
# única pasada. Solo hay una tirada a la vez (concurrency).
# OJO: la marca horaria es un push a la rama «reloj» y GitHub usa el reloj.yml DE ESA RAMA, no el de main. Esa copia es
# un envoltorio fino que llama a proceso/reloj_tirada.sh (en main): la lógica no se duplica. Si se toca cómo arranca el
# Reloj, hay que actualizar también esa copia (comprobaciones.yml avisa si se desincroniza).
on:
  push:
    branches: [reloj]
  schedule:
    - cron: "10 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mirar (4 pasadas cada 10 minutos; una sola si lo arranca el cron de respaldo)
        run: bash proceso/reloj_tirada.sh "${{ github.event_name }}"
