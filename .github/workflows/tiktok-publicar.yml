name: Publicar en TikTok

# Cada mañana publica en TikTok el vídeo del día que dejó preparado «Evangelio diario» la tarde anterior:
# en español (@catolicaid) y, si está conectada, en inglés (@catolicaid_en, release en-AAAA-MM-DD).
# Respaldo: 23:10 UTC = 00:10 en España en invierno (hora_publicacion 00:05) y reintento a la 01:00 UTC.
# Lo normal es que lo lance antes el Reloj y espere a la hora exacta.
# Los cron de GitHub se retrasan: el Reloj lo lanza igualmente desde la hora de publicación.
on:
  schedule:
    - cron: "10 23 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy)"
        required: false
        default: ""
      esperar:
        description: "Esperar a la hora de publicación antes de publicar (lo usa el Reloj)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      GH_TOKEN: ${{ github.token }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a la hora de publicación
        if: inputs.esperar == 'true' && inputs.fecha != ''
        timeout-minutes: 190
        run: |
          python3 proceso/esperar.py "${{ inputs.fecha }}"
          git pull -q --ff-only origin main || true  # lo que haya cambiado mientras esperaba (p. ej. ya publicado)
      - name: Publicar
        id: publicar
        run: |
          exec > >(tee publicar.log) 2>&1
          F="${{ inputs.fecha }}"; [ -n "$F" ] || F=$(TZ=Europe/Madrid date +%F)
          HECHOS=""
          FALLO=0
          # Español (@catolicaid, release tiktok-F) e inglés (@catolicaid_en, release en-F), cada uno con su permiso.
          for L in es en pt; do
            if [ "$L" = "es" ]; then N="$F"; REL="tiktok-$F"; ENC=secretos/tiktok.enc; else N="$F-$L"; REL="$L-$F"; ENC=secretos/tiktok-$L.enc; fi
            echo "::group::TikTok $L ($N)"
            if [ ! -f "$ENC" ]; then echo "TikTok ($L) aún no está conectado."; echo "::endgroup::"; continue; fi
            if ! gh release view "$REL" >/dev/null 2>&1; then echo "No hay vídeo preparado (ya publicado o no generado)."; echo "::endgroup::"; continue; fi
            if python3 -c "import json,sys; sys.exit(0 if json.load(open('episodios/$N.json')).get('tiktok') else 1)" 2>/dev/null; then echo "Ya publicado en TikTok."; echo "::endgroup::"; continue; fi
            # Solo con el OK del revisor (o de Carlos) y si no se ha pedido no publicar.
            if ! python3 -c "import json,sys; r=json.load(open(f'revisiones/$N.json')); g=json.load(open(f'episodios/$N.json')); sys.exit(0 if r.get('ok') and not g.get('no_publicar') else 1)" 2>/dev/null; then
              echo "Sin OK del revisor (o marcado para no publicar): no se publica."; echo "::endgroup::"; continue
            fi
            rm -rf t && mkdir -p t && gh release download "$REL" -D t -p video.mp4
            [ "$L" != "en" ] && gh release view "$REL" --json body -q .body > t/texto.txt
            if TIKTOK_CUENTA=$L python3 - "$F" "$L" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "proceso")
          import tiktok
          fecha, idioma = sys.argv[1], sys.argv[2]
          reg = Path(f"episodios/{fecha}{'' if idioma == 'es' else '-' + idioma}.json")
          d = json.loads(reg.read_text(encoding="utf-8")) if reg.exists() else {}
          t = Path("t/texto.txt")
          if idioma in ("es", "pt") and t.exists() and t.read_text(encoding="utf-8").strip():
              texto = t.read_text(encoding="utf-8")
          else:  # inglés: el mismo texto que Instagram en inglés
              a, m, dia = map(int, fecha.split("-"))
              months = ["January", "February", "March", "April", "May", "June", "July", "August", "September",
                        "October", "November", "December"]
              frase = d.get("frase_clave", "")
              texto = (f"“{frase}”\n\n" if frase else "") + (
                  f"Gospel of the day · {months[m - 1]} {dia} · {d.get('cita', '')} 🙏\n\n{d.get('titulo', '')}\n"
                  "Listen with your heart and share it with someone who needs it. ✝️\n\n"
                  "#GospelOfTheDay #DailyGospel #Gospel #WordOfGod #Catholic #Faith #Jesus #God #Prayer")
          cfg = json.loads(Path("config/personajes.json").read_text(encoding="utf-8")).get("tiktok", {})
          pid, estado, priv = tiktok.subir("t/video.mp4", texto, cfg.get("privacidad", "PUBLIC_TO_EVERYONE"))
          print("TikTok:", idioma, pid, estado, priv)
          if reg.exists():
              d["tiktok"] = {"publish_id": pid, "estado": estado, "privacidad": priv}
              reg.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
          if estado == "FAILED":
              raise SystemExit("TikTok rechazó el vídeo")
          PY
            then
              HECHOS="$HECHOS $N"
              # La release la comparten TikTok e Instagram: se borra cuando las dos han publicado.
              if [ ! -f secretos/instagram.enc ] || python3 -c "import json,sys; sys.exit(0 if json.load(open('episodios/$N.json')).get('instagram') else 1)"; then
                gh release delete "$REL" --yes --cleanup-tag
              fi
            else
              FALLO=1
            fi
            echo "::endgroup::"
          done
          echo "hechos=$HECHOS" >> "$GITHUB_OUTPUT"
          exit $FALLO
      - name: Avisar por Telegram (fallo al publicar)
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          F="${{ inputs.fecha }}"; [ -n "$F" ] || F=$(TZ=Europe/Madrid date +%F)
          M=$(grep -hE "rechaza|no da acceso|RuntimeError|Error|error" publicar.log 2>/dev/null | grep -v "^\s*$" | tail -1 | cut -c1-200)
          python3 proceso/avisos.py publicacion "TikTok" "$F" "$M"
      - name: Guardar
        if: always()
        run: |
          git config user.name "gestor-catholicaid"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodios/ secretos/ estado/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "TikTok: publicación del día"
            git pull -q --rebase && git push -q
          fi
      - name: Avisar por Telegram (publicado en TikTok)
        if: always() && steps.publicar.outputs.hechos != ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: for N in ${{ steps.publicar.outputs.hechos }}; do python3 proceso/avisos.py tiktok "$N"; done
