name: Publicar en TikTok

# Cada mañana publica en TikTok el vídeo del día que dejó preparado «Evangelio diario» la tarde anterior.
# 00:00 UTC = 1:00 en España en invierno (2:00 en verano), según hora_publicacion. El segundo es un reintento.
# Los cron de GitHub se retrasan: el Reloj lo lanza igualmente desde la hora de publicación.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = hoy)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        id: publicar
        run: |
          F="${{ inputs.fecha }}"; [ -n "$F" ] || F=$(TZ=Europe/Madrid date +%F)
          if [ ! -f secretos/tiktok.enc ]; then echo "TikTok aún no está conectado."; exit 0; fi
          if ! gh release view "tiktok-$F" >/dev/null 2>&1; then echo "No hay vídeo preparado para $F (ya publicado o no generado)."; exit 0; fi
          # Solo con el OK del revisor (o de Carlos) y si no se ha pedido no publicar.
          if ! python3 -c "import json,sys; r=json.load(open(f'revisiones/$F.json')); g=json.load(open(f'episodios/$F.json')); sys.exit(0 if r.get('ok') and not g.get('no_publicar') else 1)" 2>/dev/null; then
            echo "El vídeo de $F no tiene el OK del revisor (o está marcado para no publicar): no se publica."; exit 0
          fi
          mkdir -p t && gh release download "tiktok-$F" -D t -p video.mp4
          gh release view "tiktok-$F" --json body -q .body > t/texto.txt
          python3 - "$F" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "proceso")
          import tiktok
          fecha = sys.argv[1]
          cfg = json.loads(Path("config/personajes.json").read_text(encoding="utf-8")).get("tiktok", {})
          pid, estado, priv = tiktok.subir("t/video.mp4", Path("t/texto.txt").read_text(encoding="utf-8"),
                                           cfg.get("privacidad", "PUBLIC_TO_EVERYONE"))
          print("TikTok:", pid, estado, priv)
          reg = Path(f"episodios/{fecha}.json")
          if reg.exists():
              d = json.loads(reg.read_text(encoding="utf-8"))
              d["tiktok"] = {"publish_id": pid, "estado": estado, "privacidad": priv}
              reg.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
          if estado == "FAILED":
              raise SystemExit("TikTok rechazó el vídeo")
          PY
          gh release delete "tiktok-$F" --yes --cleanup-tag
          echo "fecha=$F" >> "$GITHUB_OUTPUT"
      - name: Guardar
        if: always()
        run: |
          git config user.name "gestor-catholicaid"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodios/ secretos/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "TikTok: publicación del día"
            git pull -q --rebase && git push -q
          fi
      - name: Avisar por Telegram (publicado en TikTok)
        if: success() && steps.publicar.outputs.fecha != ''
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python3 proceso/avisos.py tiktok "${{ steps.publicar.outputs.fecha }}"
