name: Evangelio diario

on:
  # Cada tarde prepara y programa el vídeo de MAÑANA (hora UTC; en España +1/+2).
  # Las ejecuciones siguientes son reintentos: si el vídeo ya está subido, no hacen nada.
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 19 * * *"
    - cron: "0 21 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (vacío = mañana)"
        required: false
        default: ""
      modo:
        description: "prueba = privado sin programar · diario = programado a las 07:00"
        type: choice
        options: [prueba, diario]
        default: prueba
      subir:
        description: "Subir a YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: evangelio
  cancel-in-progress: false

jobs:
  producir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        timeout-minutes: 20
        run: |
          # A veces el servidor de paquetes se cuelga: 3 intentos de 5 minutos como máximo.
          for i in 1 2 3; do
            if timeout 300 sudo apt-get update -qq && \
               timeout 300 sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg fonts-dejavu-core fonts-dejavu-extra > /dev/null; then
              break
            fi
            echo "Instalación lenta o fallida (intento $i); reintento"
            [ $i = 3 ] && exit 1
            sleep 20
          done
          pip install -q --timeout 60 edge-tts pillow

      - name: Producir vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_IMAGENES: ${{ secrets.GEMINI_API_KEY_IMAGENES }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FECHA: ${{ inputs.fecha }}
          MODO: ${{ inputs.modo || 'diario' }}
          SUBIR: ${{ github.event_name == 'schedule' || inputs.subir }}
        run: |
          ARGS="--modo $MODO"
          if [ -n "$FECHA" ]; then ARGS="$ARGS --fecha $FECHA"; fi
          if [ "$SUBIR" != "true" ]; then ARGS="$ARGS --no-subir"; fi
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --si-falta"; fi
          python proceso/evangelio.py $ARGS

      - name: Guardar vídeo y guion (30 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evangelio-${{ github.run_number }}
          path: |
            salida/**/video.mp4
            salida/**/guion.json
            salida/**/subtitulos.ass
          retention-days: 30
          if-no-files-found: ignore

      - name: Dejar el vídeo listo para TikTok (se publica a las 7:00)
        if: success() && (github.event_name == 'schedule' || inputs.modo == 'diario')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$(ls -d salida/*/ 2>/dev/null | head -1)
          if [ -z "$D" ] || [ ! -f "$D/video.mp4" ]; then echo "Nada nuevo para TikTok"; exit 0; fi
          F=$(basename "$D")
          gh release delete "tiktok-$F" --yes --cleanup-tag 2>/dev/null || true
          gh release create "tiktok-$F" "$D/video.mp4" --title "TikTok $F" --notes-file "$D/tiktok.txt" --prerelease

      - name: Guardar registro del episodio
        if: success()
        run: |
          git config user.name "gestor-catholicaid"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodios/ biblia/ musica/ biblioteca/dias/
          if ! git diff --cached --quiet; then
            git commit -q -m "Registro del episodio $(ls -t episodios | head -1)"
            git pull -q --rebase
            git push -q
          fi

      - name: Avisar por Telegram (vídeo listo)
        if: success()
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: python3 proceso/avisos.py listo
