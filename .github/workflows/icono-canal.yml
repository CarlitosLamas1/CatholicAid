name: Propuesta de icono

# A mano: Gemini propone un icono para las cuentas y Nano Banana lo pinta (céntimos). Sube el resultado como archivo del run.
on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Indicación opcional para Gemini (vacío = libre)"
        required: false
        default: ""
      variantes:
        description: "true = pintar las variantes de icono/prompts.json con el banner como referencia (sin pedir concepto)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  icono:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_IMAGENES: ${{ secrets.GEMINI_API_KEY_IMAGENES }}
      IDEA: ${{ inputs.idea }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        if: inputs.variantes == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Proponer y pintar
        run: |
          if [ "${{ inputs.variantes }}" = "true" ]; then
            python3 proceso/icono.py salida --prompts icono/prompts.json --ref icono/banner-referencia.jpg
          else
            python3 proceso/icono.py salida --idea "$IDEA"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: icono-propuesta
          path: salida/
