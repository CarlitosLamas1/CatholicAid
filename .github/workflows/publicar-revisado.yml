name: Publicar revisado

# Se activa cuando el revisor (rutina de Claude en la nube) sube su veredicto a revisiones/AAAA-MM-DD.json,
# o a mano / desde el bot de Telegram (👍 Publicar) con la fecha.
# OK -> sube a YouTube programado a las 07:00 y deja TikTok listo. No OK -> rehace una vez; si no, no se publica.
on:
  push:
    branches: [main]
    paths: ["revisiones/**"]
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha AAAA-MM-DD (o AAAA-MM-DD-en para el canal en inglés)"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: publicar-revisado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fechas revisadas
        id: fechas
        run: |
          if [ -n "${{ inputs.fecha }}" ]; then
            F="${{ inputs.fecha }}"
          else
            # AAAA-MM-DD (español) o AAAA-MM-DD-en (inglés)
            F=$(git diff --name-only HEAD~1 HEAD -- revisiones/ | sed -n -E 's#^revisiones/([0-9]{4}-[0-9]{2}-[0-9]{2}(-en)?)\.json$#\1#p' | tr '\n' ' ')
          fi
          echo "Fechas: $F"
          echo "lista=$F" >> "$GITHUB_OUTPUT"

      - name: Publicar
        if: steps.fechas.outputs.lista != ''
        run: |
          exec > >(tee publicar.log) 2>&1
          for F in ${{ steps.fechas.outputs.lista }}; do python3 proceso/publicar.py "$F"; done

      - name: Avisar por Telegram (fallo al publicar)
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          F="$(echo ${{ steps.fechas.outputs.lista }} | awk '{print $1}' | cut -c1-10)"
          M=$(grep -hE "rechaza|no da acceso|RuntimeError|Error|error" publicar.log 2>/dev/null | grep -v "^\s*$" | tail -1 | cut -c1-200)
          python3 proceso/avisos.py publicacion "YouTube" "$F" "$M"
      - name: Guardar registro
        if: always()
        run: |
          git config user.name "gestor-catholicaid"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A episodios/ biblioteca/dias/ estado/
          if ! git diff --cached --quiet; then
            git commit -q -m "Publicar revisado: ${{ steps.fechas.outputs.lista }}"
            git pull -q --rebase && git push -q
          fi
