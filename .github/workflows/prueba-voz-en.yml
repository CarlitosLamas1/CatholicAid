name: Prueba de voz (inglés, temporal)

# Temporal (rama mejoras-ingles): cómo leen los modelos de voz del inglés la instrucción de estilo.
on:
  push:
    branches: [mejoras-ingles]
    paths: [".github/workflows/prueba-voz-en.yml"]

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import base64, json, os, time, urllib.request, urllib.error, wave
          G = "https://generativelanguage.googleapis.com/v1beta/models"
          H = {"Content-Type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"].strip()}
          estilo = "the voice of a wise and serene old man, deep and warm, natural pace, clear neutral American accent"
          texto = ("A reading from the holy Gospel according to Matthew.\n\nAt that time, Jesus told his disciples this parable:\n\n"
                   "The Gospel of the Lord.")
          variantes = {
            "instruccion": {"contents": [{"parts": [{"text": f"Read aloud, with {estilo}, the following paragraphs, in this order. Between one paragraph and the next always make a clear one-second pause:\n\n{texto}"}]}]},
            "sistema": {"systemInstruction": {"parts": [{"text": f"Read the user's text aloud, with {estilo}. Between paragraphs make a clear one-second pause. Read only the text."}]},
                        "contents": [{"parts": [{"text": texto}]}]},
            "etiqueta": {"contents": [{"parts": [{"text": f"[{estilo}; one-second pause between paragraphs]\n\n{texto}"}]}]},
          }
          os.makedirs("voz", exist_ok=True)
          for modelo in ["gemini-3.8-flash-tts", "gemini-3.1-flash-tts-preview"]:
              for nombre, cuerpo in variantes.items():
                  cuerpo = {**cuerpo, "generationConfig": {"responseModalities": ["AUDIO"], "speechConfig": {
                      "voiceConfig": {"prebuiltVoiceConfig": {"voiceName": "Iapetus"}}}}}
                  try:
                      with urllib.request.urlopen(urllib.request.Request(f"{G}/{modelo}:generateContent", json.dumps(cuerpo).encode(), H), timeout=180) as r:
                          d = json.loads(r.read())["candidates"][0]["content"]["parts"][0]["inlineData"]
                      datos = base64.b64decode(d["data"])
                      ruta = f"voz/{modelo}_{nombre}.wav"
                      with wave.open(ruta, "wb") as w:
                          w.setnchannels(1); w.setsampwidth(2); w.setframerate(24000); w.writeframes(datos)
                      print(f"{modelo} {nombre}: {len(datos)/48000:.1f} s ({d.get('mimeType')}) para {len(texto)} letras (~{len(texto)/15:.0f} s)", flush=True)
                  except urllib.error.HTTPError as e:
                      print(f"{modelo} {nombre}: {e.code} {e.read().decode(errors='replace')[:200]}", flush=True)
                  time.sleep(21)
      - uses: actions/upload-artifact@v4
        with:
          name: prueba-voz-en
          path: voz/*.wav
